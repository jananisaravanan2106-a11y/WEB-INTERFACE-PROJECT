<!DOCTYPE html>
<html>
	
<head>

    <title>Student Profile Card</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container{
            width: 300px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button{
            padding: 10px 20px;
            background-color:rgb(211, 9, 76);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .card{


            width: 500px;
            margin: 35px auto;

            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 0px 10px gray;
            display: none;
        }

        h2{
            color: rgb(56, 52, 56);
        }

        p{
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>STUDENTS DETAILS </h2>

    <input type="text" id="name" placeholder="Enter Student Name"><br>

    <input type="text" id="roll" placeholder="Enter Roll Number"><br>

    <input type="number" id="marks" placeholder="Enter Marks"><br>

    <button onclick="displayProfile()">Display Profile</button>
</div>

<div class="card" id="profileCard">
    <h2>Student Profile</h2>

    <p><b>Name:</b><span id="sname"></span></p>

    <p><b>Roll No:</b><span id="sroll"></span></p>


    <p><b>Marks:</b><span id="smarks"></span></p>

    <p><b>Grade:</b><span id="sgrade"></span></p>
</div>

<script>
function displayProfile(){

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let marks = parseInt(document.getElementById("marks").value);

    let grade;

    if(marks >= 90){
        grade = "A";
    }
    else if(marks >= 80){
        grade = "B";
    }
    else if(marks >= 70){
        grade = "C";
    }
    else if(marks >= 60){
        grade = "D";
    }
    else{
        grade = "F";
    }

    document.getElementById("sname").innerHTML = name;
    document.getElementById("sroll").innerHTML = roll;

    document.getElementById("smarks").innerHTML = marks;
    document.getElementById("sgrade").innerHTML = grade;

    document.getElementById("profileCard").style.display = "block";

}
</script>

</body>
</html>
